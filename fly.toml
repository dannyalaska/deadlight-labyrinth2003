# fly.toml — dreams_and_static beta deployment
# Replace "dreams-and-static" with whatever name you pick during `fly launch`

app = "dreams-and-static"
primary_region = "iad"  # US East — change to "lax" (West), "lhr" (London), etc.

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true   # spins down when idle — free tier friendly
  auto_start_machines = true  # spins back up on request (~2s cold start)
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/login"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume — keeps SQLite (beta.db) across deploys
[[mounts]]
  source = "dreams_data"
  destination = "/app/data"
  initial_size = "1gb"
