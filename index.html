<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dreams_and_static</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="vignette" aria-hidden="true"></div>

    <div class="forum-wrapper" id="forumWrapper">
      <!-- Forum header -->
      <div class="forum-header">
        <div>
          <h1 class="forum-title" id="forumTitle">dreams_and_static</h1>
          <p class="forum-tagline" id="forumTagline">a place for what keeps you up at night</p>
        </div>
        <div class="forum-header-right" id="headerRight">
          <span id="headerStatus">loading...</span>
        </div>
      </div>

      <!-- Nav bar -->
      <div class="forum-nav">
        <a href="#" id="navHome">Board Index</a>
      </div>

      <!-- Banner ad — hidden until Act 2 -->
      <div class="banner-ad" id="bannerAd" aria-hidden="true" style="display:none">
        <span class="banner-ad-text" id="bannerAdText">FREE AIM emoticons — click here!</span>
        <span class="banner-ad-x" id="bannerAdX" title="close ad">x</span>
      </div>

      <!-- Breadcrumb -->
      <div class="breadcrumb" id="breadcrumb">
        <a href="#" class="breadcrumb-home">dreams_and_static</a>
      </div>

      <!-- Content area — dynamically rendered -->
      <div class="forum-content" id="forumContent">
        <div class="loading-bar">
          loading forum<span class="dots"></span>
        </div>
      </div>

      <!-- Footer -->
      <div class="forum-footer">
        Powered by <a href="#">phpBB</a> 2.0.6 &copy; 2001, 2002 phpBB Group
        <br>
        <a href="#" id="navTos" class="footer-tos-link">Terms of Service</a>
      </div>
    </div>

    <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
