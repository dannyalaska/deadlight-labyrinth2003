[tool.poetry]
name = "deadlight-2003"
version = "0.1.0"
description = "AI Labyrinth (Deadlight 2003) prototype backend and tools."
authors = ["AI Labyrinth Team <labyrinth@example.com>"]
readme = "README.md"
packages = [{ include = "labyrinth" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
python-dotenv = "^1.0.1"
requests = "^2.32.3"
streamlit = "^1.36.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
